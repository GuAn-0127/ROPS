<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
<title>ROPS Test Report</title>
<style>
:root{--bg:#151515;--panel:#202020;--line:#3a3a3a;--text:#f3f3f3}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
.topbar{height:52px;background:#1d1d1d;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 10px;z-index:20;position:relative}
.iconbtn{width:38px;height:38px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;cursor:pointer;font-size:20px}
.iconbtn:hover{background:#333}
.title{font-size:14px;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.spacer{flex:1}
.pagebox{display:flex;align-items:center;gap:6px;font-size:13px}
.pageinput{width:44px;height:30px;border:1px solid #555;background:#111;color:#fff;border-radius:4px;text-align:center}
.zoomtext{min-width:50px;text-align:center;font-size:12px;color:#ddd}
.app{height:calc(100% - 52px);display:flex}
.sidebar{width:220px;background:#1d1d1d;border-right:1px solid var(--line);overflow:auto;padding:12px 10px;transition:transform .2s ease;z-index:15}
.thumb{padding:8px;border:1px solid transparent;border-radius:6px;margin-bottom:10px;cursor:pointer}
.thumb.active{background:#323232;border-color:#666}
.thumb img{display:block;width:100%;height:auto;background:#fff}
.thumbnum{text-align:center;color:#aaa;font-size:12px;margin-top:6px}
.viewer{flex:1;overflow:auto;position:relative;display:flex;justify-content:center;align-items:flex-start;background:#111;padding:24px;-webkit-overflow-scrolling:touch}
.stage{transform-origin:top center;width:min(100%,900px);display:flex;justify-content:center}
.stage img{display:block;max-width:100%;height:auto;background:#fff;box-shadow:0 2px 16px rgba(0,0,0,.5);user-select:none;-webkit-user-drag:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:#bbb;font-size:14px;pointer-events:none}
@media(max-width:760px){
  .topbar{height:48px;padding:0 4px;gap:2px}
  .app{height:calc(100% - 48px)}
  .title{display:none}
  .sidebar{position:absolute;left:0;top:48px;bottom:0;width:42vw;min-width:140px;max-width:220px;box-shadow:6px 0 18px rgba(0,0,0,.35);transform:translateX(-105%)}
  .sidebar.open{transform:translateX(0)}
  .viewer{padding:8px 4px}
  .pagebox{font-size:12px}
  .zoomtext{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <button class="iconbtn" id="menuBtn" title="缩略图">☰</button>
  <div class="title">ROPS Test Report</div>
  <div class="spacer"></div>
  <button class="iconbtn" id="prevBtn" title="上一页">‹</button>
  <div class="pagebox"><input id="pageInput" class="pageinput" inputmode="numeric" value="1"><span>/ <span id="pageTotal"></span></span></div>
  <button class="iconbtn" id="nextBtn" title="下一页">›</button>
  <button class="iconbtn" id="minusBtn" title="缩小">−</button>
  <span id="zoomText" class="zoomtext">100%</span>
  <button class="iconbtn" id="plusBtn" title="放大">＋</button>
  <button class="iconbtn" id="fitBtn" title="适合宽度">↔</button>
</header>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="viewer" id="viewer">
    <div class="loading" id="loading">正在加载报告…</div>
    <div class="stage" id="stage"><img id="mainImage" alt="ROPS Test Report"></div>
  </main>
</div>

<script>
const pages=["page-01.jpg","page-02.jpg","page-03.jpg","page-04.jpg","page-05.jpg","page-06.jpg"];
let current=1, zoom=1;
const sidebar=document.getElementById("sidebar");
const mainImage=document.getElementById("mainImage");
const stage=document.getElementById("stage");
const viewer=document.getElementById("viewer");
const loading=document.getElementById("loading");
const pageInput=document.getElementById("pageInput");
const pageTotal=document.getElementById("pageTotal");
const zoomText=document.getElementById("zoomText");
pageTotal.textContent=pages.length;

pages.forEach((src,idx)=>{
  const wrap=document.createElement("div"); wrap.className="thumb"; wrap.dataset.page=idx+1;
  const img=document.createElement("img"); img.src=src; img.loading="lazy"; img.alt=`第 ${idx+1} 页`;
  const n=document.createElement("div"); n.className="thumbnum"; n.textContent=`第 ${idx+1} 页`;
  wrap.append(img,n);
  wrap.onclick=()=>{goTo(idx+1); if(innerWidth<=760) sidebar.classList.remove("open");};
  sidebar.appendChild(wrap);
});

function updateThumbs(){
  document.querySelectorAll(".thumb").forEach(el=>el.classList.toggle("active",Number(el.dataset.page)===current));
}
function applyZoom(){
  stage.style.transform=`scale(${zoom})`;
  zoomText.textContent=Math.round(zoom*100)+"%";
}
function render(){
  loading.style.display="grid";
  loading.textContent="正在加载报告…";
  mainImage.onload=()=>{loading.style.display="none"; viewer.scrollTo({top:0,left:0,behavior:"auto"});};
  mainImage.onerror=()=>{loading.textContent="页面加载失败，请刷新重试";};
  mainImage.src=pages[current-1];
  pageInput.value=current;
  updateThumbs();
  applyZoom();
}
function goTo(n){current=Math.max(1,Math.min(pages.length,Number(n)||1));render();}
function setZoom(v){zoom=Math.max(.6,Math.min(3,v));applyZoom();}

document.getElementById("menuBtn").onclick=()=>sidebar.classList.toggle("open");
document.getElementById("prevBtn").onclick=()=>goTo(current-1);
document.getElementById("nextBtn").onclick=()=>goTo(current+1);
document.getElementById("minusBtn").onclick=()=>setZoom(zoom-.15);
document.getElementById("plusBtn").onclick=()=>setZoom(zoom+.15);
document.getElementById("fitBtn").onclick=()=>{zoom=1;applyZoom();viewer.scrollTo(0,0);};
pageInput.onchange=()=>goTo(pageInput.value);
pageInput.onkeydown=e=>{if(e.key==="Enter")goTo(pageInput.value)};

let sx=null,sy=null;
viewer.addEventListener("touchstart",e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY;}},{passive:true});
viewer.addEventListener("touchend",e=>{
  if(sx===null||zoom>1.05)return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.2) dx<0?goTo(current+1):goTo(current-1);
  sx=sy=null;
},{passive:true});
render();
</script>
</body>
</html>
